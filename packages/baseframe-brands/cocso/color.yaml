kind: Tokens
metadata:
  id: brand-cocso-color
  name: cocso brand colour
  description: >
    cocso.co.kr 의 브랜드 색. 디자인 시스템의 베이스 primary 는 중립(neutral)
    램프의 별칭이라 어떤 브랜드도 아니다 — medicaldb 처럼 그 검정을 그대로 쓰는
    소비자가 있다. cocso 브랜드는 그 위에 얹는 테마다.

    이 값들은 website/apps/web/src/styles/theme-override.css 가 `:root:root` 로
    덮고 있던 것을 그대로 옮긴 것이다. 같은 값이 세 저장소에 살지 않도록 여기가
    유일한 출처가 되고, 웹은 theme-cocso.css 를 import 하고 모바일은
    CocsoBrandCocso 를 동기화한다.

    별도 디렉터리에 있는 이유: 베이스 AST 에 같은 이름(`$color.interactive.primary`)
    을 두 번 선언하면 리졸버의 Map 이 조용히 뒤쪽을 택한다. 브랜드는 원시 램프와만
    합쳐 따로 빌드한다.
data:
  collection: brand
  tokens:
    # primary 램프 전체 → info 램프. 웹이 램프까지 덮는 이유는 `primary-*` 를
    # 직접 참조하는 소비 코드가 있기 때문이다.
    $color.primary-50:
      values: { light: $color.info-50, dark: $color.info-50 }
    $color.primary-100:
      values: { light: $color.info-100, dark: $color.info-100 }
    $color.primary-200:
      values: { light: $color.info-200, dark: $color.info-200 }
    $color.primary-300:
      values: { light: $color.info-300, dark: $color.info-300 }
    $color.primary-400:
      values: { light: $color.info-400, dark: $color.info-400 }
    $color.primary-500:
      values: { light: $color.info-500, dark: $color.info-500 }
    $color.primary-600:
      values: { light: $color.info-600, dark: $color.info-600 }
    $color.primary-700:
      values: { light: $color.info-700, dark: $color.info-700 }
    $color.primary-800:
      values: { light: $color.info-800, dark: $color.info-800 }
    $color.primary-900:
      values: { light: $color.info-900, dark: $color.info-900 }
    $color.primary-950:
      values: { light: $color.info-950, dark: $color.info-950 }
    $color.interactive.primary:
      values:
        light: $color.info-500
        # 웹은 color-mix(in srgb, info-500 85%, surface-primary) 다. 생성기는
        # color-mix 를 내보내지 못하므로 그 결과를 고정한다: #2260d3.
        # 흰 글자 대비 5.70 (라이트 info-500 위 4.55).
        dark: "#2260d3"
    $color.interactive.primary-hover:
      values: { light: $color.info-600, dark: $color.info-600 }
    $color.interactive.primary-active:
      values: { light: $color.info-700, dark: $color.info-700 }
    # A step toward the dim end of the ramp, which is what "muted" says. This
    # was `info-500` in both modes — the same value as `interactive.primary` in
    # light, so a muted control was pixel-identical to a live one. The base has
    # the relationship right (primary-950 against a mid primary-500); the brand
    # overlay lost it.
    $color.interactive.primary-muted:
      values: { light: $color.info-200, dark: $color.info-700 }
    # 채움이 두 테마 모두 파랑이므로 그 위 글자도 두 테마 모두 white 다.
    # 베이스는 다크에서 neutral-950 인데, 그것은 채움이 밝게 뒤집힐 때의 값이다.
    $color.text.on-primary:
      values: { light: $color.white, dark: $color.white }

    # --- 다크의 바탕 한 단계 ---
    #
    # "다크가 너무 어둡다"는 사용자 피드백에서 온 변경이다. 베이스는 카드
    # neutral-950(#131416), 페이지 neutral-900(#1E2124) 으로 거의 검정이다.
    # 램프의 다음 칸(neutral-900/800)으로 올리면 페이지가 #33363D 가 되어
    # 구분선(neutral-800)과 같은 값이 되므로, 램프 사이의 값을 고정한다.
    #
    # 브랜드 레이어에 두는 이유: 이 밝기는 cocso 앱의 결정이고 웹 다크는
    # 그대로 둔다. 웹은 data-brand 를 걸지 않으므로 아무것도 바뀌지 않는다.
    #
    # 라이트는 베이스 그대로다 — 여기서 바뀌는 것은 다크뿐이다.
    #
    # 카드 위 text-primary 15.49 · text-secondary 5.49,
    # 페이지 위 13.58 · 4.81 (AA 4.5). 카드↔페이지 차이 1.141 로
    # 베이스의 1.139 를 유지한다 — 줄어들면 카드 경계가 사라진다.
    $color.surface.primary:
      values: { light: $color.white, dark: "#1A1D21" }
    $color.surface.secondary:
      values: { light: $color.neutral-50, dark: "#24282D" }
    # 목록 구분선. 베이스의 neutral-800 은 새 카드 위에서 1.40 까지 떨어진다
    # (베이스 카드 위에서는 1.52). 한 단계 올려 1.58 로 되돌린다.
    $color.border.secondary:
      values: { light: $color.neutral-100, dark: "#3A3E46" }
    # 알림·뱃지의 옅은 틴트. 베이스의 다크 값은 *-950 이고, 램프의 그 칸은
    # 색마다 밝기가 달라 새 바탕 위에서 danger 는 1.11, success 는 1.01 로
    # 사실상 바탕과 같았다. 각 색의 400 을 페이지 색에 18% 섞어 고르게
    # 띄운다 — 바탕과 1.26~1.31, 카드와 1.44~1.49, 그 위 글자는 4.79 이상.
    $color.feedback.danger-subtle:
      values: { light: $color.danger-50, dark: "#493231" }
    $color.feedback.success-subtle:
      values: { light: $color.success-50, dark: "#293F34" }
    $color.feedback.warning-subtle:
      values: { light: $color.warning-50, dark: "#413925" }
    $color.feedback.info-subtle:
      values: { light: $color.info-50, dark: "#2B3951" }
