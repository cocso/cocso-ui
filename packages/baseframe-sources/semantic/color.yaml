kind: Tokens
metadata:
  id: color
  name: Color
  description: semantic color tokens for Baseframe
data:
  collection: theme
  tokens:
    $color.alpha.shadow1:
      values:
        light: 'rgba(0, 0, 0, 0.04)'
        dark: 'rgba(0, 0, 0, 0.24)'
    $color.alpha.shadow2:
      values:
        light: 'rgba(0, 0, 0, 0.08)'
        dark: 'rgba(0, 0, 0, 0.36)'
    $color.alpha.shadow3:
      values:
        light: 'rgba(0, 0, 0, 0.12)'
        dark: 'rgba(0, 0, 0, 0.48)'
    # same-in-both: no colour to flip
    $color.transparent:
      values:
        light: transparent
        dark: transparent
    $color.text.primary:
      values:
        light: $color.neutral-950
        dark: $color.neutral-50
    $color.text.secondary:
      values:
        light: $color.neutral-600
        dark: $color.neutral-400
    $color.text.tertiary:
      values:
        light: $color.neutral-400
        dark: $color.neutral-500
    $color.text.disabled:
      values:
        light: $color.neutral-400
        dark: $color.neutral-600
    $color.text.on-primary:
      values:
        light: $color.white
        dark: $color.neutral-950
    # text-on-* do not move. Their fills (interactive-success and friends) keep
    # the same hue in both themes, so a foreground that flipped would land
    # light-on-light — it put near-white text on bright amber at 1.67:1.
    # same-in-both: foreground for a fill that does not flip
    $color.text.on-success:
      values:
        light: $color.white
        dark: $color.white
    # same-in-both: foreground for a fill that does not flip
    $color.text.on-danger:
      values:
        light: $color.white
        dark: $color.white
    # same-in-both: foreground for a fill that does not flip
    $color.text.on-info:
      values:
        light: $color.white
        dark: $color.white
    # same-in-both: foreground for a fill that does not flip
    $color.text.on-warning:
      values:
        light: $color.neutral-950
        dark: $color.neutral-950
    # same-in-both: mid-ramp, reads on both extremes
    $color.text.muted:
      values:
        light: $color.neutral-500
        dark: $color.neutral-500
    $color.surface.primary:
      values:
        light: $color.white
        dark: $color.neutral-950
    $color.surface.secondary:
      values:
        light: $color.neutral-50
        dark: $color.neutral-900
    $color.surface.inverse:
      values:
        light: $color.neutral-950
        dark: $color.white
    $color.surface.neutral:
      values:
        light: $color.neutral-100
        dark: $color.neutral-800
    # One step lighter than the surface they sit on in the dark theme, mirroring
    # the light theme. border-secondary was neutral-900, the same value as
    # surface-secondary, so every divider drawn on a card was invisible at 1.00.
    $color.border.primary:
      values:
        light: $color.neutral-200
        dark: $color.neutral-700
    $color.border.secondary:
      values:
        light: $color.neutral-100
        dark: $color.neutral-800
    $color.border.strong:
      values:
        light: $color.neutral-400
        dark: $color.neutral-500
    # Translucent tints that darken what is under them in the light theme and
    # must lighten it in the dark one. The black-alpha-* primitives they point at
    # stay black in both themes by design — the Dialog scrim depends on that —
    # so the overlay role needs its own tokens.
    $color.overlay.subtle:
      values:
        light: $color.black-alpha-5
        dark: $color.white-alpha-5
    $color.overlay.muted:
      values:
        light: $color.black-alpha-10
        dark: $color.white-alpha-10
    $color.overlay.strong:
      values:
        light: $color.black-alpha-20
        dark: $color.white-alpha-20
    $color.interactive.primary:
      values:
        light: $color.primary-950
        dark: $color.primary-50
    $color.interactive.primary-hover:
      values:
        light: $color.primary-800
        dark: $color.primary-200
    $color.interactive.primary-active:
      values:
        light: $color.primary-700
        dark: $color.primary-300
    # same-in-both: mid-ramp, reads on both extremes
    $color.interactive.primary-muted:
      values:
        light: $color.primary-500
        dark: $color.primary-500
    $color.interactive.primary-subtle:
      values:
        light: $color.primary-100
        dark: $color.primary-900
    $color.interactive.primary-text:
      values:
        light: $color.primary-800
        dark: $color.primary-200
    $color.interactive.secondary:
      values:
        light: $color.neutral-100
        dark: $color.neutral-800
    $color.interactive.secondary-hover:
      values:
        light: $color.neutral-200
        dark: $color.neutral-700
    $color.interactive.neutral:
      values:
        light: $color.neutral-100
        dark: $color.neutral-800
    $color.interactive.neutral-hover:
      values:
        light: $color.neutral-200
        dark: $color.neutral-700
    $color.interactive.neutral-active:
      values:
        light: $color.neutral-300
        dark: $color.neutral-600
    # Fixed-hue fills: a saturated accent reads on either surface as a filled
    # area, so these keep their value. They are fills, not text — Link painted
    # its label with interactive-info and its hover with interactive-info-active,
    # which measured 4.05 and 1.74 on the dark surface. Text uses the -text form.
    # same-in-both: fixed-hue fill, reads on both themes
    $color.interactive.danger:
      values:
        light: $color.danger-500
        dark: $color.danger-500
    # same-in-both: fixed-hue fill, reads on both themes
    $color.interactive.danger-hover:
      values:
        light: $color.danger-600
        dark: $color.danger-600
    # same-in-both: fixed-hue fill, reads on both themes
    $color.interactive.danger-active:
      values:
        light: $color.danger-700
        dark: $color.danger-700
    # same-in-both: fixed-hue fill, reads on both themes
    $color.interactive.danger-hover-subtle:
      values:
        light: $color.danger-400
        dark: $color.danger-400
    $color.interactive.danger-subtle-hover:
      values:
        light: $color.danger-50
        dark: $color.danger-950
    $color.interactive.danger-subtle-active:
      values:
        light: $color.danger-100
        dark: $color.danger-900
    # same-in-both: fixed-hue fill, reads on both themes
    $color.interactive.success:
      values:
        light: $color.success-500
        dark: $color.success-500
    # same-in-both: fixed-hue fill, reads on both themes
    $color.interactive.success-hover:
      values:
        light: $color.success-600
        dark: $color.success-600
    # same-in-both: fixed-hue fill, reads on both themes
    $color.interactive.success-active:
      values:
        light: $color.success-700
        dark: $color.success-700
    # same-in-both: fixed-hue fill, reads on both themes
    $color.interactive.success-hover-subtle:
      values:
        light: $color.success-400
        dark: $color.success-400
    # same-in-both: fixed-hue fill, reads on both themes
    $color.interactive.warning:
      values:
        light: $color.warning-300
        dark: $color.warning-300
    # same-in-both: fixed-hue fill, reads on both themes
    $color.interactive.warning-hover:
      values:
        light: $color.warning-400
        dark: $color.warning-400
    # same-in-both: fixed-hue fill, reads on both themes
    $color.interactive.warning-active:
      values:
        light: $color.warning-500
        dark: $color.warning-500
    # same-in-both: fixed-hue fill, reads on both themes
    $color.interactive.warning-hover-subtle:
      values:
        light: $color.warning-400
        dark: $color.warning-400
    # same-in-both: fixed-hue fill, reads on both themes
    $color.interactive.info:
      values:
        light: $color.info-500
        dark: $color.info-500
    # same-in-both: fixed-hue fill, reads on both themes
    $color.interactive.info-hover:
      values:
        light: $color.info-600
        dark: $color.info-600
    # same-in-both: fixed-hue fill, reads on both themes
    $color.interactive.info-active:
      values:
        light: $color.info-700
        dark: $color.info-700
    # same-in-both: fixed-hue fill, reads on both themes
    $color.interactive.info-hover-subtle:
      values:
        light: $color.info-400
        dark: $color.info-400
    # The text form of the info role. info-500 clears AA on white by 0.05 and
    # misses it everywhere else — 4.17 on a card, 3.70 on the worst tint — so the
    # light value is the 600 level. The dark values run the other way up the ramp.
    $color.interactive.info-text:
      values:
        light: $color.info-600
        dark: $color.info-300
    $color.interactive.info-text-hover:
      values:
        light: $color.info-700
        dark: $color.info-200
    $color.focus.ring:
      values:
        light: $color.primary-950
        dark: $color.primary-50
    # The 500 level is tuned against white and lands at 3.96-4.05 on the dark
    # surface, under AA. One step up clears it at 5.36-5.96 without shifting hue;
    # the 300 level clears it too but washes out, and a pastel red does not read
    # as danger. These are fills now — Progress and Spinner — since text moved to
    # the -text tokens.
    $color.feedback.danger:
      values:
        light: $color.danger-500
        dark: $color.danger-400
    # Status surfaces. Near-invisible by luminance in both themes (1.01-1.18),
    # which is deliberate: what separates a tint from its background is hue, and
    # a contrast ratio does not measure that. Measured by dE, the dark tints are
    # the more distinct of the two.
    $color.feedback.danger-subtle:
      values:
        light: $color.danger-50
        dark: $color.danger-950
    $color.feedback.danger-text:
      values:
        light: $color.danger-600
        dark: $color.danger-300
    $color.feedback.danger-border:
      values:
        light: $color.danger-200
        dark: $color.danger-800
    $color.feedback.success:
      values:
        light: $color.success-500
        dark: $color.success-400
    $color.feedback.success-subtle:
      values:
        light: $color.success-50
        dark: $color.success-950
    $color.feedback.success-text:
      values:
        light: $color.success-600
        dark: $color.success-300
    $color.feedback.success-border:
      values:
        light: $color.success-200
        dark: $color.success-800
    # Retired. success-400 is 3.09 on white, so it is not a text colour; nothing
    # paints with it since StockQuantityStatus moved to feedback-success-text. It
    # stays exported because removing a published token is breaking.
    # same-in-both: retired, not used as a text color
    $color.feedback.success-muted:
      values:
        light: $color.success-400
        dark: $color.success-400
    $color.feedback.warning:
      values:
        light: $color.warning-500
        dark: $color.warning-400
    $color.feedback.warning-subtle:
      values:
        light: $color.warning-50
        dark: $color.warning-950
    $color.feedback.warning-text:
      values:
        light: $color.warning-600
        dark: $color.warning-300
    $color.feedback.warning-border:
      values:
        light: $color.warning-200
        dark: $color.warning-800
    $color.feedback.info:
      values:
        light: $color.info-500
        dark: $color.info-400
    $color.feedback.info-subtle:
      values:
        light: $color.info-50
        dark: $color.info-950
    $color.feedback.info-text:
      values:
        light: $color.info-600
        dark: $color.info-300
    $color.feedback.info-border:
      values:
        light: $color.info-200
        dark: $color.info-800
