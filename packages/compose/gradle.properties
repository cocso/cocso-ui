android.useAndroidX=true
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
kotlin.code.style=official

# 골든은 기본으로 **비교**한다. Roborazzi 의 기본은 기록이라, 두면 매 실행이
# 새 기준선을 쓰고 테스트는 무엇을 바꾸든 통과한다 — 통과만 하는 게이트다.
# 의도한 변경 뒤 다시 찍을 때만 -Proborazzi.test.record=true 를 붙인다.
roborazzi.test.verify=true

# The mobile packages' version — one number for the Swift package and the
# Compose module. The mobile-release workflow tags main with it (plain semver,
# which SwiftPM reads) and publishes this module to GitHub Packages under it.
# Bump it in the same change that alters what either package ships.
VERSION_NAME=1.0.0
