# Only what the token module needs. Deliberately not a copy of the app's
# catalog — this package is the design system, not the app, and carrying the
# app's dependency set here would make it look like it needs them.
[versions]
agp = "8.7.3"
kotlin = "2.0.21"
compose-bom = "2024.12.01"
junit = "4.13.2"
roborazzi = "1.7.0"
robolectric = "4.13"
# Backdrop blur. Compose has none of its own; Haze draws the content behind a
# node into it, blurred (API 31+, a scrim below). 1.5.x is the line built
# against Compose 1.7, which the BOM above resolves to.
haze = "1.5.4"

[libraries]
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "compose-bom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
# Text and the progress indicator only. The Material controls the design
# system replaces (Button, TextField, Switch) are deliberately not used.
compose-material3 = { group = "androidx.compose.material3", name = "material3" }
# The eye glyph CCInput's reveal toggle needs. The core icon set has no
# equivalent, and iOS uses `eye`/`eye.slash` — a text label instead would be the
# one place the two platforms show a different control for the same thing.
compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
haze = { group = "dev.chrisbanes.haze", name = "haze", version.ref = "haze" }
# 렌더 검증용. 이 패키지의 뷰는 컴파일과 텍스트 비교로만 확인되고 있었고,
# 컴파일되지만 아무것도 그리지 않는 뷰는 그 게이트를 그대로 통과했다.
junit = { group = "junit", name = "junit", version.ref = "junit" }
compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
roborazzi = { group = "io.github.takahirom.roborazzi", name = "roborazzi", version.ref = "roborazzi" }
roborazzi-compose = { group = "io.github.takahirom.roborazzi", name = "roborazzi-compose", version.ref = "roborazzi" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }

[plugins]
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
roborazzi = { id = "io.github.takahirom.roborazzi", version.ref = "roborazzi" }
