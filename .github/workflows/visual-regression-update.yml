name: Update Visual Regression Baselines

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to update baselines on (defaults to the branch this run was dispatched from)'
        required: false

jobs:
  update-baselines:
    name: Generate Baselines
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Falls back to the dispatch ref, not to `main`. The input used to
      # default to 'main', so `gh workflow run visual-regression-update.yml
      # --ref <branch>` — which reads as "run this on <branch>" — checked out
      # main, regenerated its baselines and pushed the result straight to the
      # default branch. Only `-f branch=<branch>` selected the branch.
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.branch || github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright Browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright Chromium
        working-directory: apps/storybook
        run: npx playwright install chromium --with-deps

      - name: Build Storybook
        run: pnpm turbo run build --filter=@cocso-ui/storybook

      - name: Generate Baselines
        working-directory: apps/storybook
        run: |
          npx serve storybook-static -p 6006 &
          npx wait-on http://localhost:6006 --timeout 60000
          pnpm test:visual:update

      - name: Commit Baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/storybook/__snapshots__/
          # [skip ci] is honest here: a push made with GITHUB_TOKEN cannot
          # trigger a workflow at all, so dropping the marker would not get the
          # new baselines verified — it would only make the intent misleading.
          # Verify them by running Visual Regression manually on the branch.
          git diff --cached --quiet || git commit -m "chore: update visual regression baselines [skip ci]"
          git push
