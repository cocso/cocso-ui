name: Changeset Release

on:
  push:
    branches:
      - main
  # Recovery hatch. A `push` trigger is skipped whenever the head commit
  # message contains a skip marker, and a squash merge inherits the bodies of
  # every commit on the branch — one stray marker in a bot commit silently
  # cancelled a release.
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  pull-requests: write
  # npm Trusted Publishing: the runner exchanges this OIDC token for a
  # short-lived registry token, which is why no `NPM_TOKEN` is set below.
  id-token: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      # `pnpm publish` hands the publish — and the OIDC exchange — to the npm
      # CLI, which needs 11.5.1 or later for Trusted Publishing. Node 22 ships
      # npm 10.
      - name: Upgrade npm for Trusted Publishing
        run: npm install -g npm@11

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@v2
        with:
          publish-script: pnpm run release
          pr-title: "chore: version packages"
          commit-message: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
